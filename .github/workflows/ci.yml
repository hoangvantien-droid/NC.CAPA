name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build & test (JDK 17 + MySQL Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Runner ubuntu-latest đã có sẵn Docker → Testcontainers tự dùng để dựng MySQL 8.
      - name: Build & run tests
        run: mvn -B -ntp clean test
