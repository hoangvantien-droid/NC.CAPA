spring:
  application:
    name: nc-capa
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nc_capa?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USER:nc_capa}
    password: ${DB_PASS:nc_capa}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED   # auto-aggregation cần READ COMMITTED (StateMachine §5.1)
  jpa:
    hibernate:
      ddl-auto: validate            # DDL do Flyway quản; Hibernate chỉ validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  seed:
    enabled: ${SEED_ENABLED:true}       # bật seed master data + dữ liệu mô phỏng khi demo
  capa:
    reminder:
      max-postpone: 2                   # M lần dời hạn mốc (REQ điểm mở #7)
  nc:
    recurrence-window-days: 90          # rolling window tái diễn (REQ điểm mở #6)
  sod:
    enabled: true                       # chặn người đề xuất tự duyệt cấp 1 (StateMachine §2.2)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
