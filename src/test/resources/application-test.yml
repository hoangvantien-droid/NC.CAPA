spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  seed:
    enabled: false        # test tự nạp dữ liệu cần thiết, không seed demo
  ticket:
    scheduler:
      enabled: false      # test điều khiển flush thủ công (deterministic), tắt scheduler
  notification:
    scheduler:
      enabled: false      # test gọi NotificationService trực tiếp, tắt scheduler (tránh flaky)
  sod:
    enabled: true
  capa:
    reminder:
      max-postpone: 2
  nc:
    recurrence-window-days: 90
